<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Marketing Studio</title>
<style>
  /* Claude's own colours and type (the host sets the --color-* and --font-* variables); fallbacks for other hosts */
  :root {
    color-scheme: light dark;
    --ink: var(--color-text-primary, light-dark(#141413, #faf9f5));
    --ink-2: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
    --ink-3: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
    --panel: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
    --raised: var(--color-background-primary, light-dark(#ffffff, #30302e));
    --line: var(--color-border-tertiary, light-dark(rgba(31, 30, 29, 0.15), rgba(222, 220, 209, 0.15)));
    --line-2: var(--color-border-secondary, light-dark(rgba(31, 30, 29, 0.3), rgba(222, 220, 209, 0.3)));
    --solid: var(--color-background-inverse, light-dark(#141413, #faf9f5));
    --solid-ink: var(--color-text-inverse, light-dark(#ffffff, #141413));
    --ok: var(--color-text-success, light-dark(#265b19, #7ab948));
    --bad: var(--color-text-danger, light-dark(#7f2c28, #ee8884));
    --ring: var(--color-ring-primary, light-dark(rgba(20, 20, 19, 0.7), rgba(250, 249, 245, 0.7)));
    --radius: var(--border-radius-md, 8px);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --slide-h: 440px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; color: var(--ink); font-family: var(--font); font-size: var(--font-text-sm-size, 14px); line-height: var(--font-text-sm-line-height, 1.4); }
  .wrap { padding: 12px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; min-width: 0; }
  .title { font-size: var(--font-text-md-size, 16px); font-weight: var(--font-weight-semibold, 600); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--ink-3); font-size: var(--font-text-xs-size, 12px); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .track { position: relative; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .track.single { justify-content: center; }
  .slide { flex: 0 0 auto; width: min(100%, calc(var(--slide-h) * var(--ar))); aspect-ratio: var(--ar); scroll-snap-align: center; border-radius: var(--radius); overflow: hidden; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .slide img, .slide canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .film { display: flex; justify-content: center; }
  .film video, .film .slide { max-height: var(--slide-h); width: auto; height: var(--slide-h); max-width: 100%; aspect-ratio: var(--ar); border-radius: var(--radius); display: block; }
  .film video { background: #000; }

  .skeleton { background: linear-gradient(90deg, var(--panel) 0%, var(--raised) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .progress { height: 4px; border-radius: 2px; background: var(--panel); overflow: hidden; margin-top: 10px; }
  .progress > i { display: block; height: 100%; width: 2%; background: var(--solid); transition: width 0.4s ease; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .nav { display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .nav span { min-width: 3.5em; text-align: center; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-weight: var(--font-weight-medium, 500); min-height: 36px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled) { background: var(--panel); }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  button.primary { background: var(--solid); color: var(--solid-ink); border-color: transparent; }
  button.primary:hover:not(:disabled) { background: var(--solid); opacity: 0.88; }
  button.icon { width: 36px; padding: 0; justify-content: center; }
  button:disabled { opacity: 0.45; cursor: default; }
  button svg { width: 16px; height: 16px; flex: none; }
  .caption { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--panel); display: flex; gap: 10px; align-items: flex-start; }
  .caption p { margin: 0; flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; }
  .caption.open p { display: block; }
  .caption .more { min-height: 0; padding: 0; border: 0; background: none; color: var(--ink-3); text-decoration: underline; font-size: var(--font-text-xs-size, 12px); }
  .caption .stack { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .status { margin-top: 8px; min-height: 1.4em; font-size: var(--font-text-xs-size, 12px); color: var(--ink-3); }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .progress > i { transition: none; } .track { scroll-behavior: auto; } }
  @media (max-width: 420px) { .actions { width: 100%; } .actions button { flex: 1 1 auto; justify-content: center; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head"><div class="title" id="title">Getting your design ready</div><div class="meta" id="meta"></div></div>
  <div id="stage"></div>
  <div class="bar" id="bar" hidden>
    <div class="nav" id="nav">
      <button class="icon" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="count" aria-live="polite"></span>
      <button class="icon" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="actions">
      <button class="primary" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Copy</button>
      <button id="copyAll" hidden>Copy all</button>
      <button id="final" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9Z"/></svg>HD version</button>
      <button id="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>Show in folder</button>
      <button class="icon" id="full" hidden aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    </div>
  </div>
  <div class="caption" id="caption" hidden>
    <p id="captionText"></p>
    <div class="stack"><button id="copyCaption">Copy caption</button><button class="more" id="captionMore" hidden>Show all</button></div>
  </div>
  <div class="status" id="status" role="status"></div>
</div>
<!--SDK-->
<script type="module">
  const KEY = 'marketing-studio/view';
  const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = window.McpExtApps;
  const $ = (id) => document.getElementById(id);
  const app = new App({ name: 'Marketing Studio viewer', version: '1.2.2' }, { availableDisplayModes: ['inline', 'fullscreen'] });

  let input = {}; // the tool call's arguments: project, name, kind, size
  let view = null; // the export being shown
  let index = 0; // the slide in the middle
  let fullscreen = false;
  const files = new Map(); // uri -> { blob, url }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const textOf = (r) => (r?.content ?? []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  const pretty = (s) => String(s ?? '').replace(/[-_]+/g, ' ').replace(/^./, (c) => c.toUpperCase());
  const secs = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')} min` : `${Math.round(s)} s`);
  const say = (msg, kind = '') => {
    $('status').textContent = msg;
    $('status').className = `status ${kind}`;
  };
  const can = (what) => !!app.getHostCapabilities()?.[what];

  async function callApp(name, args) {
    const r = await app.callServerTool({ name, arguments: args });
    if (r.isError) throw new Error(textOf(r) || 'Something went wrong.');
    return r;
  }

  // ---- files: through the resource the server offers, or in small pieces if this chat app can't read resources
  const bytesOf = (b64) => {
    const s = atob(b64);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  };
  async function fetchFile(uri) {
    if (files.has(uri)) return files.get(uri);
    let blob;
    try {
      const c = (await app.readServerResource({ uri })).contents[0];
      blob = new Blob([bytesOf(c.blob)], { type: c.mimeType });
    } catch {
      const parts = [];
      let size = Infinity;
      let mime = '';
      for (let at = 0; at < size; ) {
        const s = (await callApp('viewer_file', { uri, offset: at })).structuredContent;
        const piece = bytesOf(s.data);
        if (!piece.length) break;
        parts.push(piece);
        size = s.size;
        mime = s.mime;
        at += piece.length;
      }
      blob = new Blob(parts, { type: mime });
    }
    const f = { blob, url: URL.createObjectURL(blob) };
    files.set(uri, f);
    return f;
  }

  // ---- host look and layout
  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) applyDocumentTheme(ctx.theme);
    if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
    if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
    const s = ctx.safeAreaInsets;
    if (s) $('wrap').style.padding = `${12 + s.top}px ${12 + s.right}px ${12 + s.bottom}px ${12 + s.left}px`;
    $('full').hidden = !(ctx.availableDisplayModes ?? []).includes('fullscreen');
    fullscreen = ctx.displayMode === 'fullscreen';
    document.documentElement.style.setProperty('--slide-h', fullscreen ? 'max(320px, calc(100vh - 170px))' : '440px');
    $('full').setAttribute('aria-label', fullscreen ? 'Back to the chat' : 'Full screen');
  }

  // ---- waiting for a long export
  function guessRatio() {
    const m = /(\d{3,4})\s*[x×]\s*(\d{3,4})/.exec(input.size ?? '');
    if (input.width && input.height) return input.width / input.height;
    if (m) return Number(m[1]) / Number(m[2]);
    if (/story|reel|9.?16/i.test(input.size ?? '') || input.kind === 'video') return 9 / 16;
    if (/square|1.?1/i.test(input.size ?? '')) return 1;
    return 4 / 5;
  }
  // what's being made, from the job or the tool's arguments; neutral words until it's known
  const making = () =>
    input.kind === 'video' ? 'Making your video' : input.kind === 'images' ? ((input.count ?? input.pages?.length) === 1 ? 'Making your post' : 'Making your slides') : 'Making your design';
  const learn = (info) => {
    if (!info) return;
    const { kind, width, height, size, name, pages, count } = info;
    input = {
      ...input,
      ...(['images', 'video'].includes(kind) ? { kind } : {}),
      ...(width && height ? { width, height } : {}),
      ...(typeof size === 'string' ? { size } : {}),
      ...(name ? { name } : {}),
      ...(Array.isArray(pages) ? { count: pages.length } : typeof count === 'number' ? { count } : {}),
    };
  };
  function showWaiting(message, progress, title) {
    $('title').textContent = title ?? making();
    $('meta').textContent = progress == null ? '' : `${Math.round(progress * 100)}%`;
    $('bar').hidden = true;
    const st = $('stage');
    if (!st.querySelector('.progress')) st.innerHTML = '<div class="film"><div class="slide skeleton"></div></div><div class="progress"><i></i></div>';
    st.style.setProperty('--ar', guessRatio());
    if (progress != null) st.querySelector('.progress > i').style.width = `${Math.max(2, Math.round(progress * 100))}%`;
    say(message ? `${pretty(message)}…` : 'Working on it…');
  }
  function showProblem(message) {
    $('title').textContent = 'Nothing to show';
    $('meta').textContent = '';
    $('stage').innerHTML = '';
    $('bar').hidden = true;
    say(message || 'Something went wrong. Ask Claude to export it again.', 'bad');
  }

  // ---- what an answer means: a finished export, a job still running, or a project to look up
  async function handle(result) {
    if (result?.isError) return showProblem(textOf(result));
    const d = result?._meta?.[KEY] ?? result?.structuredContent?.[KEY];
    // a preview whose HD version was made since (with the button here) shows the HD one
    if (d?.video?.quality === 'preview') {
      const now = await callApp('viewer_latest', { project: d.project, name: d.name }).then((r) => r.structuredContent.view).catch(() => null);
      return show(now?.name === d.name && now.video?.quality === 'final' ? now : d);
    }
    if (d?.items || d?.video) return show(d);
    const job = d?.job ?? /job "([\w-]+)"/.exec(textOf(result))?.[1];
    learn(d);
    if (job) return follow(job);
    return latest();
  }
  async function follow(job, title) {
    for (;;) {
      let s;
      try {
        s = (await callApp('viewer_job', { job })).structuredContent;
      } catch (e) {
        return showProblem(e.message);
      }
      learn(s.info);
      if (s.state === 'running') {
        showWaiting(s.message, s.progress, title);
        await sleep(1500);
      } else if (s.state === 'done' && s.view) return show(s.view);
      else if (s.state === 'failed') return showProblem(s.error);
      else return latest();
    }
  }
  async function latest() {
    if (!input.project) return showProblem('Nothing to show yet.');
    try {
      show((await callApp('viewer_latest', { project: input.project, name: input.name })).structuredContent.view);
    } catch (e) {
      showProblem(e.message);
    }
  }

  // ---- showing it
  const items = () => (view?.kind === 'images' ? view.items : view ? [view.video] : []);
  async function show(d) {
    view = d;
    index = 0;
    for (const f of files.values()) URL.revokeObjectURL(f.url);
    files.clear();
    $('title').textContent = pretty(d.name);
    const st = $('stage');
    st.innerHTML = '';
    st.style.setProperty('--ar', d.width / d.height);
    if (d.kind === 'images') {
      $('meta').textContent = `${d.items.length} ${d.items.length === 1 ? 'image' : 'slides'} · ${d.width}×${d.height}`;
      const track = document.createElement('div');
      track.className = d.items.length > 1 ? 'track' : 'track single';
      track.id = 'track';
      track.tabIndex = 0;
      track.setAttribute('aria-label', `${pretty(d.name)}, ${d.items.length} slides`);
      for (const it of d.items) {
        const s = document.createElement('div');
        s.className = 'slide skeleton';
        s.setAttribute('role', 'group');
        s.setAttribute('aria-label', `${it.label} of ${d.items.length}`);
        track.append(s);
      }
      st.append(track);
      track.addEventListener('scroll', onScroll, { passive: true });
      track.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') go(index + 1);
        if (e.key === 'ArrowLeft') go(index - 1);
      });
      for (const [i, it] of d.items.entries()) await loadSlide(track.children[i], it).catch(() => (track.children[i].textContent = ''));
    } else {
      const v = d.video;
      $('meta').textContent = `${v.quality === 'final' ? 'Final' : 'Preview'} · ${secs(v.duration)} · ${d.width}×${d.height}`;
      st.innerHTML = '<div class="film"><div class="slide skeleton"></div></div>';
      say('Loading the video…');
      try {
        const { url } = await fetchFile(v.view);
        const el = document.createElement('video');
        el.controls = true;
        el.playsInline = true;
        el.preload = 'auto';
        el.src = url;
        el.onerror = () => say("The video can't play inside the chat. Use Show in folder to watch it.", 'bad');
        st.querySelector('.film').replaceChildren(el);
      } catch (e) {
        return showProblem(e.message);
      }
    }
    showCaption(d.caption);
    setBar();
    say(
      d.kind === 'images'
        ? 'Ask Claude in the chat for any changes. Copy pastes a slide straight into WhatsApp, Canva or an email; Copy all puts every slide on the clipboard as files.'
        : d.video.quality === 'final'
          ? 'Ask Claude in the chat for any changes. Copy puts the video file on the clipboard, ready to paste into WhatsApp.'
          : d.video.canFinal
            ? 'A quick, half-size preview. Ask Claude for changes, or press HD version when it looks right.'
            : 'A quick, half-size preview. Ask Claude for changes, or for the final when it looks right.',
    );
  }

  function showCaption(text) {
    $('caption').hidden = !text;
    if (!text) return;
    $('captionText').textContent = text;
    $('caption').classList.remove('open');
    requestAnimationFrame(() => ($('captionMore').hidden = $('captionText').scrollHeight <= $('captionText').clientHeight + 2));
  }

  async function loadSlide(el, it) {
    const { blob, url } = await fetchFile(it.view);
    const img = new Image();
    img.alt = it.label;
    try {
      await new Promise((ok, no) => {
        img.onload = ok;
        img.onerror = no;
        img.src = url;
      });
      el.replaceChildren(img);
    } catch {
      // a chat app that doesn't allow blob: pictures still lets us draw them
      const bmp = await createImageBitmap(blob);
      const c = document.createElement('canvas');
      c.width = bmp.width;
      c.height = bmp.height;
      c.getContext('2d').drawImage(bmp, 0, 0);
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', it.label);
      el.replaceChildren(c);
    }
    el.classList.remove('skeleton');
  }

  // ---- slides: where we are
  let told = -1;
  let tellTimer;
  function onScroll() {
    const t = $('track');
    if (!t) return;
    let best = 0;
    if (t.scrollLeft + t.clientWidth >= t.scrollWidth - 2) best = t.children.length - 1;
    else if (t.scrollLeft > 2) {
      const mid = t.scrollLeft + t.clientWidth / 2;
      let gap = Infinity;
      [...t.children].forEach((c, i) => {
        const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
        if (d < gap) [gap, best] = [d, i];
      });
    }
    if (best !== index) {
      index = best;
      setBar();
    }
  }
  function go(i) {
    const t = $('track');
    if (!t) return;
    index = Math.max(0, Math.min(t.children.length - 1, i));
    const c = t.children[index];
    t.scrollTo({ left: c.offsetLeft - (t.clientWidth - c.offsetWidth) / 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    setBar();
  }
  function setBar() {
    const list = items();
    const n = list.length;
    const slides = view?.kind === 'images';
    $('bar').hidden = !view;
    $('nav').hidden = !slides || n < 2;
    $('count').textContent = `${index + 1} / ${n}`;
    $('prev').disabled = index <= 0;
    $('next').disabled = index >= n - 1;
    $('copyAll').hidden = !slides || n < 2;
    $('final').hidden = !(view?.kind === 'video' && view.video.canFinal);
    $('copy').lastChild.textContent = slides ? (n > 1 ? `Copy slide ${index + 1}` : 'Copy') : 'Copy video';
    // let Claude know which slide the person means by "this one"
    clearTimeout(tellTimer);
    if (slides && n > 1 && told !== index && can('updateModelContext'))
      tellTimer = setTimeout(() => {
        told = index;
        app.updateModelContext({ content: [{ type: 'text', text: `In the Marketing Studio viewer the person is looking at slide ${index + 1} of ${n} of "${view.name}" (project "${view.title}").` }] }).catch(() => {});
      }, 700);
  }

  // ---- buttons
  async function busy(button, work) {
    button.disabled = true;
    try {
      await work();
    } catch (e) {
      say(e.message, 'bad');
    } finally {
      button.disabled = false;
      setBar();
    }
  }
  $('prev').onclick = () => go(index - 1);
  $('next').onclick = () => go(index + 1);
  $('copy').onclick = () =>
    busy($('copy'), async () => {
      const it = items()[index];
      say('Copying…');
      await callApp('viewer_copy', { project: view.project, files: [it.file] });
      say(view.kind === 'images' ? `Copied ${it.label.toLowerCase()}. Paste it into WhatsApp, Canva or an email.` : 'Copied the video file. Paste it into WhatsApp or a folder.', 'ok');
    });
  $('copyAll').onclick = () =>
    busy($('copyAll'), async () => {
      const list = items();
      say('Copying…');
      await callApp('viewer_copy', { project: view.project, files: list.map((it) => it.file) });
      say(`Copied all ${list.length} slides as files, in order. Paste them into WhatsApp, an email or a folder.`, 'ok');
    });
  $('copyCaption').onclick = () =>
    busy($('copyCaption'), async () => {
      await callApp('viewer_copy', { project: view.project, caption: view.name });
      say('Copied the caption. Paste it under the post.', 'ok');
    });
  $('captionMore').onclick = () => {
    const open = $('caption').classList.toggle('open');
    $('captionMore').textContent = open ? 'Show less' : 'Show all';
  };
  $('folder').onclick = () =>
    busy($('folder'), async () => {
      await callApp('viewer_folder', { project: view.project, file: items()[index].file });
      say('Opened the folder on this laptop.', 'ok');
    });
  // the final video from this preview, made right here (Claude is told when it's ready)
  $('final').onclick = async () => {
    const was = view;
    $('final').disabled = true;
    try {
      const { job } = (await callApp('viewer_final', { project: was.project, name: was.name })).structuredContent;
      await follow(job, 'Making the HD version');
      if (view === was) {
        // it didn't work: back to the preview, with the reason
        const why = $('status').textContent;
        await show(was);
        return say(why || "Couldn't make the HD version. Ask Claude in the chat for the final.", 'bad');
      }
      if (view?.kind === 'video' && view.video.quality === 'final' && can('updateModelContext'))
        app.updateModelContext({ content: [{ type: 'text', text: `The person pressed "HD version" in the Marketing Studio viewer: the final video of "${view.name}" (project "${view.title}") is made and showing in the chat. No need to export it again.` }] }).catch(() => {});
    } catch (e) {
      say(e.message, 'bad');
    } finally {
      $('final').disabled = false;
      setBar();
    }
  };
  $('full').onclick = () => app.requestDisplayMode({ mode: fullscreen ? 'inline' : 'fullscreen' }).then((r) => applyContext({ ...app.getHostContext(), displayMode: r.mode })).catch(() => {});

  // ---- connect (handlers first, so the first notifications aren't missed)
  app.ontoolinput = ({ arguments: a }) => {
    input = { ...input, ...(a ?? {}) };
    if (!view) showWaiting(null, null);
  };
  // the arguments as Claude is still writing them: enough to say "video" or "slides" early
  app.ontoolinputpartial = ({ arguments: a }) => {
    learn(a);
    if (!view) showWaiting(null, null);
  };
  app.ontoolresult = (r) => handle(r);
  app.ontoolcancelled = () => showProblem('Stopped.');
  app.onhostcontextchanged = (c) => applyContext({ ...app.getHostContext(), ...c });
  showWaiting(null, null);
  await app.connect();
  applyContext(app.getHostContext());
</script>
</body>
</html>
